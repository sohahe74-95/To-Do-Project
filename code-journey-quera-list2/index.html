    <script>
      // اعمال تم ذخیره‌شده یا تم سیستم، قبل از رندر
      (function () {
        const ls = localStorage.getItem("theme");             // 'light' | 'dark' | 'system' | null
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const wantDark = ls === "dark" || (!ls || ls === "system") && prefersDark;
        if (wantDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <!-- 📅 اسکریپت تقویم فارسی (سرجاش نگه داشتم) -->
    <script>
      const PersianMonth = [
        "فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
        "مهر","آبان","آذر","دی","بهمن","اسفند",
      ];
      const Persiandays = [
        "یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه",
      ];
      const getPersianDate = (date) => {
        let newDate = moment(date);
        let year = newDate.jYear();
        let month = PersianMonth[newDate.jMonth()];
        let dayN = newDate.jDate();
        let day = Persiandays[newDate.day()];
        return `${day}، ${dayN} ${month} ${year}`;
      };
      document.addEventListener("DOMContentLoaded", function () {
        const persianDate = getPersianDate(new Date());
        const dateElement = document.getElementById("sidebar-date");
        if (dateElement) {
          dateElement.innerHTML = persianDate;
        }
      });
    </script>
